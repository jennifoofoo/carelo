version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: carelo-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carelo_db}
      POSTGRES_USER: ${POSTGRES_USER:-carelo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carelo_user} -d ${POSTGRES_DB:-carelo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carelo-network
    # Don't expose ports in production (only internal access)

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: carelo-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carelo-network
    # Don't expose ports in production (only internal access)

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: carelo-backend-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carelo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carelo_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - LOCAL_STORAGE_PATH=/app/storage
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SKIP_DEMO_DATA=true
      - DEBUG=false
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carelo-network
    # Don't expose ports directly - use nginx reverse proxy

  # Celery Worker for Async Processing
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: carelo-celery-worker-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carelo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carelo_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - LOCAL_STORAGE_PATH=/app/storage
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - carelo-network

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: carelo-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - carelo-network
    # Port will be exposed by nginx reverse proxy

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: carelo-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - carelo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  nginx_cache:
    driver: local

networks:
  carelo-network:
    driver: bridge



